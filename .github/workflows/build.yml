name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version without the v, e.g. 0.1.0. Creates tag v<version> on the selected commit. Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Tag of the release this run publishes, or empty for a plain build.
  # Either a pushed v* tag, or a manual run with the "release" input.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release != '' && format('v{0}', inputs.release) || '') }}
  # True for a push to main: that build is published to the nightly channel.
  NIGHTLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

concurrency:
  # Release runs get their own group so the cask commit they push to main
  # does not cancel them.
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      nightly_version: ${{ steps.version.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and commit count for the version

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Version
        id: version
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            version="${RELEASE_TAG#v}"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            version="${tag#v}"
            version="${version:-0.0.0}"
          fi
          build="$(git rev-list --count HEAD)"
          if [[ "$NIGHTLY" == "true" ]]; then
            # Nightly builds show e.g. 0.5.0-nightly.123 in the menu and cask.
            version="$version-nightly.$build"
            echo "nightly_version=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OMNI_ISLAND_VERSION=$version" >> "$GITHUB_ENV"
          echo "OMNI_ISLAND_BUILD=$build" >> "$GITHUB_ENV"

      - name: Build (debug)
        run: swift build

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/signing.p12"
          if [[ -n "$MACOS_CERT_P12" ]]; then
            echo "$MACOS_CERT_P12" | base64 --decode > "$P12"
            CERT_PASSWORD="$MACOS_CERT_PASSWORD"
          else
            # No stored certificate: use a throwaway one so the signing path is
            # still exercised. Such builds re-trigger permission prompts.
            echo "::warning::MACOS_CERT_P12 secret is not set; signing with a throwaway certificate. Run scripts/create-signing-cert.sh once."
            CERT_PASSWORD="throwaway"
            printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=OmniIsland Signing\n[ext]\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > "$RUNNER_TEMP/cert.cnf"
            openssl req -x509 -newkey rsa:2048 -nodes -days 30 -config "$RUNNER_TEMP/cert.cnf" \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem"
            openssl pkcs12 -export -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -name "OmniIsland Signing" -out "$P12" -passout "pass:$CERT_PASSWORD"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"
          echo "OMNI_ISLAND_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$P12" "$RUNNER_TEMP/key.pem"

      - name: Bundle .app (release)
        run: scripts/bundle.sh

      - name: Verify signature
        run: |
          codesign --verify --strict --verbose=2 build/OmniIsland.app
          codesign --display --requirements - build/OmniIsland.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' build/OmniIsland.app/Contents/Info.plist

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent OmniIsland.app OmniIsland.zip
          shasum -a 256 OmniIsland.zip | tee OmniIsland.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OmniIsland-${{ steps.version.outputs.version }}
          path: build/OmniIsland.zip
          if-no-files-found: error

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag on this commit when it does not exist yet.
          gh release create "$RELEASE_TAG" build/OmniIsland.zip \
            --target "$GITHUB_SHA" \
            --title "OmniIsland $RELEASE_TAG" --generate-notes

      - name: Publish nightly
        if: env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.nightly_version }}
        run: |
          # One rolling prerelease under the "nightly" tag. Each build adds a
          # zip named after its version, so the cask URL of the previous build
          # keeps working until the cask points at the new one.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --latest=false \
              --title "OmniIsland nightly" --notes "Build of the latest main."
          fi
          cp build/OmniIsland.zip "build/OmniIsland-$VERSION.zip"
          gh release upload nightly "build/OmniIsland-$VERSION.zip" --clobber
          gh release edit nightly --prerelease --latest=false \
            --notes "Build of main at $GITHUB_SHA (version $VERSION)."

  update-cask:
    # Points the Homebrew cask in Casks/ at the new release.
    if: needs.build.outputs.version != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --pattern OmniIsland.zip --dir "$RUNNER_TEMP"
          SHA="$(sha256sum "$RUNNER_TEMP/OmniIsland.zip" | cut -d' ' -f1)"
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 .*/  sha256 \"$SHA\"/" \
            Casks/omni-island.rb
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update omni-island cask to $VERSION" || exit 0
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  update-nightly-cask:
    # Points Casks/omni-island@nightly.rb at the nightly build of this push.
    if: needs.build.outputs.nightly_version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update cask
        env:
          VERSION: ${{ needs.build.outputs.nightly_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CASK="Casks/omni-island@nightly.rb"
          gh release download nightly --pattern "OmniIsland-$VERSION.zip" --dir "$RUNNER_TEMP"
          SHA="$(sha256sum "$RUNNER_TEMP/OmniIsland-$VERSION.zip" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            # A newer nightly may already be in the cask; never go backwards.
            current="$(sed -n -E 's/^  version "(.*)"/\1/p' "$CASK")"
            if [[ "${current##*.}" =~ ^[0-9]+$ && "${current##*.}" -gt "${VERSION##*.}" ]]; then
              echo "cask already at $current"; exit 0
            fi
            sed -i -E \
              -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 .*/  sha256 \"$SHA\"/" \
              "$CASK"
            git diff
            git commit -am "Update omni-island@nightly cask to $VERSION" || exit 0
            git push origin HEAD:main && break
            git reset -q --hard HEAD~1
            git pull -q --rebase origin main
            [[ $i == 4 ]] && exit 1
          done
          # Keep only the five newest nightly zips.
          gh release view nightly --json assets --jq '.assets[].name' \
            | grep -E '^OmniIsland-.*-nightly\.[0-9]+\.zip$' \
            | sort -t. -k4,4n | head -n -5 \
            | while read -r old; do gh release delete-asset nightly "$old" --yes; done
